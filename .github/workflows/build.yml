name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Download Vosk models
        run: |
          curl -L --fail -o en.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          curl -L --fail -o tr.zip https://alphacephei.com/vosk/models/vosk-model-small-tr-0.3.zip
          unzip -q en.zip
          unzip -q tr.zip
          mkdir -p app/src/main/assets
          mv vosk-model-small-en-us-0.15 app/src/main/assets/model
          mv vosk-model-small-tr-0.3 app/src/main/assets/model-tr
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: app/build/outputs/apk/debug/*.apk
